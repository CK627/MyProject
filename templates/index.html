<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>局域网聊天室</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="group-entry" id="groupEntry" onclick="selectGroup()">
                💬 群聊
                <span class="unread-badge" id="groupUnread" style="display: none;"></span>
            </div>
            <div class="header">
                <h3>私聊</h3>
                <div class="scan-controls">
                    <select id="interfaceSelect">
                        <option value="">选择网络接口</option>
                    </select>
                    <button id="scanBtn" onclick="scanNetwork()">扫描</button>
                    <button id="stopScanBtn" onclick="stopScan()" disabled style="background-color: #dc3545; display: none;">停止</button>
                </div>
            </div>
            <ul id="userList">
                <!-- Users will be populated here -->
            </ul>
            <div class="settings">
                <div class="my-profile">
                    <span>我的昵称: <b id="myNickname">{{ nickname }}</b></span>
                    <button class="edit-btn" onclick="editNickname()">✎</button>
                </div>
                <div class="my-avatar-row">
                    <span>我的头像:</span>
                    <div id="myAvatar" class="avatar my-avatar" title="点击更换头像" onclick="triggerAvatarUpload()"></div>
                    <input type="file" id="avatarInput" accept="image/*" style="display:none;">
                </div>
                <button onclick="toggleSettings()">设置</button>
            </div>
        </div>
        
        <div class="chat-area">
            <div class="chat-header" id="chatHeader">
                请选择用户开始聊天
            </div>
            <div class="group-members" id="groupMembers" style="display: none;"></div>
            <div class="messages" id="messages">
                <!-- Messages will appear here -->
            </div>
            <div class="input-area">
                <input type="text" id="msgInput" placeholder="输入消息..." disabled>
                <button id="sendBtn" onclick="sendMessage()" disabled>发送</button>
                <button id="fileBtn" onclick="triggerFileUpload()" disabled>文件</button>
                <button id="ticketBtn" onclick="sendTicket()" disabled>发送工单</button>
                <input type="file" id="fileInput" style="display: none;">
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="toggleSettings()">&times;</span>
            <h2>设置</h2>
            <div class="form-group">
                <label>存储路径:</label>
                <input type="text" id="storagePath" placeholder="输入绝对路径">
                <button onclick="saveSettings()">保存</button>
            </div>
            <div class="form-group">
                <label>数据管理:</label>
                <button onclick="clearAllHistory()" style="background-color: #dc3545;">清空所有聊天记录</button>
                <button onclick="clearAllFiles()" style="background-color: #dc3545;">清空所有文件</button>
            </div>
            <p class="hint">当前用户ID: {{ user_id }}</p>
        </div>
    </div>

    <!-- Ticket (工单) Modal -->
    <div id="ticketModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeTicketModal()">&times;</span>
            <h2>发送工单</h2>
            <table class="ticket-form">
                <tr>
                    <th>时间</th>
                    <td><input type="text" id="ticketTime" readonly></td>
                </tr>
                <tr>
                    <th>发起人</th>
                    <td><input type="text" id="ticketInitiator" readonly></td>
                </tr>
                <tr>
                    <th>发送进度</th>
                    <td><input type="text" id="ticketProgress" placeholder="请输入进度，如：搭建网络"></td>
                </tr>
            </table>
            <div class="ticket-actions">
                <button onclick="closeTicketModal()">取消</button>
                <button onclick="confirmSendTicket()">发送</button>
            </div>
        </div>
    </div>

    <!-- Image preview modal -->
    <div id="imageModal" class="modal image-modal" onclick="closeImageModal()">
        <img id="imageModalImg" src="" alt="图片预览">
    </div>

    <script>
        window.MY_ID = "{{ user_id }}";
        window.MY_NICKNAME = "{{ nickname }}";
        window.WEB_PORT = "{{ web_port }}";
        window.MY_AVATAR = "{{ avatar }}";
    </script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
