# ctfsweep 配置文件（可选）
#
# 自动读取位置: ~/.devtools/ctfsweep/ctfsweep.conf
# 也可用命令行 --config <文件> 显式指定，或环境变量 CTFSWEEP_CONF。
# 优先级: 命令行参数 > 本配置文件 > 内置默认值。
# 语法: KEY=value，'#' 或 ';' 开头为注释。未知键会被忽略。

# 附加关键词（逗号分隔；内置默认已含 flag,ctf）
KEYWORDS=flag,ctf,key,secret

# 结果置信度下限（0~1，低于此值的候选不显示）
MIN_SCORE=0.40

# hex/base64 解码链最大递归深度
DEPTH=3

# 每个文件最多输出条数
LIMIT=50

# 设为 true 可关闭 hex/base64 自动解码
NO_DECODE=false
