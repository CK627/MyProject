# startupctl 配置文件
#
# 读取顺序: 命令行参数 > 环境变量 > 本文件 > 内置默认值
# 查找位置: $STARTUPCTL_CONFIG，否则 ~/.devtools/startupctl/startupctl.conf
# 本文件可安全删除——删掉即全部走内置默认值。
#
# 注释用 # 或 ;

# ── 扫描范围 ──
# 是否扫描系统级根（/Library/LaunchDaemons、/etc/systemd/system 等）。
# 置 false 可加快扫描，但那些根下的项会完全不出现在结果里——而 clean 又会在
# 「扫描不完整」时拒绝运行，所以正常情况下不要关。
SCAN_SYSTEM=true

# 是否做进程枚举与聚合（proc 子命令）。关掉可让纯扫描快一些。
PROC_ENABLED=true

# Windows: 是否扫 System32\Tasks（几百个 XML，约 1 秒）
SCAN_SLOW_TASK_SCHEDULER=true

# ── 显示 ──
# list 默认只列第三方项。true 等同给每个 list 都加 --all。
SHOW_SYSTEM=false

# 白名单项是否仍然列出（只标 [白]，不隐藏）。置 false 会让白名单变成盲区——
# 会隐藏东西的白名单，是用户会忘记自己写过的白名单。强烈建议保持 true。
SHOW_WHITELISTED=true

# 表格宽度：0 = 自适应终端宽度
WIDTH=0

# ── 分类 ──
# clean 默认只处理 confidence=high 的项；改成 medium 会把「需要逐条确认」的那批
# 也纳入默认范围——不建议。
MIN_CONFIDENCE=high

# 追加「认定为第三方」的厂商前缀（逗号分隔）。用于本机自研软件：
# 例如 EXTRA_VENDORS=com.mycorp,org.mylab
EXTRA_VENDORS=

# ⚠️ 危险：把无法判定的项（unknown）当作第三方处理，使其可被 clean 命中。
# 这会绕过「不确定就倒向安全那侧」的整条防线。只在临时排查时打开。
TRUST_UNKNOWN=false

# ── 安全 ──
# true 时所有改动类命令只打印计划、绝不落盘（等同给每条命令加 --dry-run）。
# CI 用环境变量 STARTUPCTL_DRY_RUN=1 强制。
DRY_RUN=false

# false 等同全局 -y（跳过所有确认）。⚠️ 不建议：它会让 clean 在无人复核计划的情况下执行。
CONFIRM=true

# 备份保留份数；以及不足多少天的备份 prune 不删（防止刚做完就手滑清掉后悔药）
BACKUP_KEEP=20
BACKUP_MIN_DAYS=7

# kill 先发 TERM、等待后再 KILL；false 则直接 KILL
TERM_FIRST=true
