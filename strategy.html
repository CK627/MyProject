<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="images/favicon.ico" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="宁波旅游攻略：一日游、三日游、自驾游行程推荐，最佳旅游季节与实用旅行贴士。">
  <title>旅游攻略 — 宁波旅游</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css?v=20260220b">
  <link rel="stylesheet" href="css/strategy.css">
</head>
<body>

  <section class="hero hero--small">
    <div class="hero__bg">
      <img src="images/scenic/dongqian.png" alt="宁波攻略">
    </div>
    <div class="hero__overlay hero__overlay--strategy"></div>
    <div class="hero__content">
      <h1 class="hero__title">旅游攻略</h1>
      <p class="hero__subtitle">精心规划，让每一天都不虚此行</p>
    </div>
  </section>

  <!-- 最佳季节 -->
  <section class="section">
    <div class="container">
      <div class="section-header" data-animate="fade-in-up">
        <h2 class="section-title">最佳旅游季节</h2>
      </div>
      <div class="grid grid--4" data-animate="fade-in-up" data-delay="0.1">
        <div class="season-card">
          <div class="season-card__icon">🌸</div>
          <h4 class="season-card__title">春季 3-5月</h4>
          <p class="season-card__desc">樱花盛开，气候宜人。推荐赏花、踏青、游古镇。</p>
          <span class="season-card__tag season-card__tag--good">推荐</span>
        </div>
        <div class="season-card">
          <div class="season-card__icon">☀️</div>
          <h4 class="season-card__title">夏季 6-8月</h4>
          <p class="season-card__desc">适合海岛游和避暑。象山开渔节期间海鲜最鲜。</p>
          <span class="season-card__tag">适宜</span>
        </div>
        <div class="season-card">
          <div class="season-card__icon">🍂</div>
          <h4 class="season-card__title">秋季 9-11月</h4>
          <p class="season-card__desc">秋高气爽，四明山红叶醉人，最佳旅游黄金季。</p>
          <span class="season-card__tag season-card__tag--good">最佳</span>
        </div>
        <div class="season-card">
          <div class="season-card__icon">❄️</div>
          <h4 class="season-card__title">冬季 12-2月</h4>
          <p class="season-card__desc">游客较少，适合慢游。年糕节、汤圆节暖心暖胃。</p>
          <span class="season-card__tag">淡季</span>
        </div>
      </div>
    </div>
  </section>

  <!-- 行程规划 -->
  <section class="section section--alt" id="itinerary">
    <div class="container">
      <div class="section-header" data-animate="fade-in-up">
        <h2 class="section-title">行程规划</h2>
        <p class="section-subtitle">根据您的时间安排，选择最适合的路线</p>
      </div>
      <div class="strategy-grid" data-strategy-category="行程规划">
        <div class="loading-hint">加载中...</div>
      </div>
    </div>
  </section>

  <!-- 攻略指南 -->
  <section class="section" id="guides">
    <div class="container">
      <div class="section-header" data-animate="fade-in-up">
        <h2 class="section-title">攻略指南</h2>
        <p class="section-subtitle">吃喝玩乐全覆盖的实用指南</p>
      </div>
      <div class="strategy-grid" data-strategy-category="攻略指南">
        <div class="loading-hint">加载中...</div>
      </div>
    </div>
  </section>

  <!-- 实用贴士 -->
  <section class="section section--alt" id="tips">
    <div class="container">
      <div class="section-header" data-animate="fade-in-up">
        <h2 class="section-title">实用贴士</h2>
      </div>
      <div class="strategy-grid" data-strategy-category="实用贴士">
        <div class="loading-hint">加载中...</div>
      </div>
    </div>
  </section>

  <script src="js/common.js?v=20260220b"></script>
  <script src="js/strategy.js"></script>
</body>
</html>
