<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="images/favicon.ico" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="宁波交通指南：如何到达宁波，市内交通方式，公交、地铁、出租车等出行攻略。">
  <title>交通指南 — 宁波旅游</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css?v=20260220b">
  <link rel="stylesheet" href="css/transport.css">
</head>
<body>

  <section class="hero hero--small">
    <div class="hero__bg">
      <img src="images/index/hero.png" alt="宁波交通">
    </div>
    <div class="hero__overlay hero__overlay--transport"></div>
    <div class="hero__content">
      <h1 class="hero__title">交通指南</h1>
      <p class="hero__subtitle">多种出行方式，轻松畅游宁波</p>
    </div>
  </section>

  <!-- 到达宁波 -->
  <section class="section" id="arrive">
    <div class="container">
      <div class="section-header" data-animate="fade-in-up">
        <h2 class="section-title">到达宁波</h2>
        <p class="section-subtitle">飞机、高铁、自驾，条条大路通宁波</p>
      </div>
      <div class="transport-grid" data-transport-category="到达交通">
        <div class="loading-hint">加载中...</div>
      </div>
    </div>
  </section>

  <!-- 市内交通 -->
  <section class="section section--alt" id="city">
    <div class="container">
      <div class="section-header" data-animate="fade-in-up">
        <h2 class="section-title">市内交通</h2>
        <p class="section-subtitle">便捷的公共交通网络覆盖全城</p>
      </div>
      <div class="transport-grid" data-transport-category="市内交通">
        <div class="loading-hint">加载中...</div>
      </div>
    </div>
  </section>

  <!-- 周边交通 -->
  <section class="section" id="around">
    <div class="container">
      <div class="section-header" data-animate="fade-in-up">
        <h2 class="section-title">周边交通</h2>
        <p class="section-subtitle">轮渡出海，探索海岛秘境</p>
      </div>
      <div class="transport-grid" data-transport-category="周边交通">
        <div class="loading-hint">加载中...</div>
      </div>
    </div>
  </section>

  <!-- 出行贴士 -->
  <section class="section section--alt">
    <div class="container">
      <div class="section-header" data-animate="fade-in-up">
        <h2 class="section-title">出行贴士</h2>
      </div>
      <div class="grid grid--2" data-animate="fade-in-up" data-delay="0.1">
        <div class="transport-info-card">
          <h4 class="transport-info-card__title">💡 省钱小贴士</h4>
          <div class="transport-tips">
            <div class="transport-tip">
              <strong>宁波旅游一卡通</strong>
              <p>购买旅游一卡通，可免费乘坐公交和部分景区门票优惠，性价比很高。</p>
            </div>
          </div>
        </div>
        <div class="transport-info-card">
          <h4 class="transport-info-card__title">⏰ 出行建议</h4>
          <div class="transport-tips">
            <div class="transport-tip">
              <strong>避开高峰</strong>
              <p>工作日早晚高峰（7:30-9:00, 17:00-19:00）建议乘坐地铁避开拥堵。</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="js/common.js?v=20260220b"></script>
  <script src="js/transport.js"></script>
</body>
</html>
