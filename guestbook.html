<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="images/favicon.ico" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="宁波旅游留言板：分享您的旅行感受，留下珍贵回忆，与更多旅行者交流宁波之美。">
  <title>游客留言 — 宁波旅游</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css?v=20260220b">
  <link rel="stylesheet" href="css/guestbook.css">
</head>
<body>

  <section class="hero hero--small">
    <div class="hero__bg">
      <img src="images/scenic/dongqian.png" alt="游客留言">
    </div>
    <div class="hero__overlay hero__overlay--guestbook"></div>
    <div class="hero__content">
      <h1 class="hero__title">游客留言</h1>
      <p class="hero__subtitle">分享您的宁波故事，留下美好回忆</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="guestbook-layout">

        <!-- 留言表单 -->
        <div class="guestbook-form-wrapper" data-animate="fade-in-up">
          <h3 class="guestbook-form__title">📝 写下您的留言</h3>
          <form id="guestbookForm" class="guestbook-form">
            <div class="form-group">
              <label class="form-label" for="guestName">您的昵称 *</label>
              <input type="text" class="form-input" id="guestName" placeholder="请输入昵称" required maxlength="20">
            </div>
            <div class="form-group">
              <label class="form-label" for="guestMessage">留言内容 *</label>
              <textarea class="form-textarea" id="guestMessage" placeholder="分享您的宁波旅行感受..." required maxlength="500"></textarea>
              <div class="char-count"><span id="charCount">0</span>/500</div>
            </div>
            <button type="submit" class="btn btn--primary btn--lg guestbook-form__submit">提交留言</button>
          </form>
        </div>

        <!-- 留言列表 -->
        <div class="guestbook-list-wrapper" data-animate="fade-in-up" data-delay="0.2">
          <div class="guestbook-list__header">
            <h3 class="guestbook-list__title">💬 所有留言</h3>
            <span class="guestbook-list__count" id="messageCount">0 条留言</span>
          </div>
          <div class="guestbook-list" id="guestbookList">
            <!-- 留言由JS动态渲染 -->
            <div class="guestbook-empty" id="guestbookEmpty">
              <p>还没有留言，快来成为第一个留言的人吧！</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="js/common.js?v=20260220b"></script>
  <script src="js/guestbook.js"></script>
</body>
</html>
