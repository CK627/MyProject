<style type="text/css">
#znaudio_btn {
	padding:0;
	margin:0;
	position:fixed;
	z-index:999999;
	left:10px;
	top:10px;
	width: 30px;
	height: 30px;
	background-size: contain;
}
.znaudio_btn_on {background-image: url(audio/music_on.png);}
.znaudio_btn_off {background-image: url(audio/music_off.png);}
.rotate {
	-webkit-animation: rotating 1.2s linear infinite;
	-moz-animation: rotating 1.2s linear infinite;
	-o-animation: rotating 1.2s linear infinite;
	animation: rotating 1.2s linear infinite
}
@-webkit-keyframes rotating {
	from { -webkit-transform: rotate(0) }
	to { -webkit-transform: rotate(360deg) }
}
@keyframes rotating {
	from { transform: rotate(0) }
	to { transform: rotate(360deg) }
}
@-moz-keyframes rotating {
	from { -moz-transform: rotate(0) }
	to { -moz-transform: rotate(360deg) }
}
</style>


<input name="znyinyuezidong" id="znyinyuezidong" type="hidden" value="1"  autocomplete="on" placeholder="页面音乐控件：进入页面自动播放是值1">
<input name="znyinyues" id="znyinyues" type="hidden" value="1"  autocomplete="on" placeholder="音乐播放状态">
<div id="znaudio_btn" class="znaudio_btn_off">
  <audio src="audio/yinyue.mp3" id="znmediass" loop="loop" preload="preload" ></audio>
</div>


<script type="text/javascript">
// 获取按钮元素
var znaudio_btn = document.getElementById("znaudio_btn");
// 获取音乐元素
var znmediass = document.getElementById("znmediass");

var currentTime = 0;//初始化时间为0

//音乐播放
function znmediaplay() {
	znaudio_btn.classList.add("rotate");//添加旋转样式
	znaudio_btn.classList.add("znaudio_btn_on");//添加开启图标
	znaudio_btn.classList.remove("znaudio_btn_off");//移除禁止图标
	document.getElementById('znyinyues').value="3";
	znmediass.play();//音乐开启
}
//音乐暂停
function znmediapause() {
	znaudio_btn.classList.remove("rotate");//移除旋转样式
	znaudio_btn.classList.add("znaudio_btn_off");//添加禁止图标
	znaudio_btn.classList.remove("znaudio_btn_on");//移除开启图标
	document.getElementById('znyinyues').value="2";
	znmediass.pause();//音乐暂停
}

// 定义点击事件的切换函数
function znhandleClick() {
	if(znmediass.paused){//判断当前音乐的状态
	//如果暂停就开启
		znmediaplay();
	}else{
	//如果开启就暂停
		znmediapause();
	}
}
// 为按钮添加点击事件监听器
znaudio_btn.addEventListener('click', znhandleClick);

//设置音乐播放控件
function  znyinyuechushis(){
				if(document.getElementById('znyinyuezidong').value=="1"){//自动播放是1
							znmediaplay();
				}else{
							znmediapause();
				}
}

// 监听页面加载事件
window.addEventListener("load", function() {
	znyinyuechushis();
});

//微信里
document.addEventListener("WeixinJSBridgeReady",function(){
	znyinyuechushis();
}, false);
</script>

<script src="js/device-detector.js"></script>
<script src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js"></script>
<script src="js/weixin-config.js"></script>
<script type="text/javascript">
    // 动态获取微信JS-SDK配置
    function initWeixinConfig() {
        const currentUrl = window.location.href.split('#')[0];
        const configUrl = `api/weixin-config.php?url=${encodeURIComponent(currentUrl)}`;
        
        fetch(configUrl)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                return response.json();
            })
            .then(data => {
                if (data.success && data.data) {
                    const config = {
                        debug: false,
                        appId: data.data.appId,
                        timestamp: data.data.timestamp,
                        nonceStr: data.data.nonceStr,
                        signature: data.data.signature,
                        jsApiList: data.data.jsApiList || [
                            'updateAppMessageShareData',
                            'updateTimelineShareData'
                        ]
                    };
                    
                    wx.config(config);
                } else {
                    console.error('微信配置获取失败:', data);
                }
            })
            .catch(error => {
                console.error('微信配置请求失败:', error);
            });
    }

    // 初始化微信配置
    initWeixinConfig();

    wx.error(function (res) {
        console.log('微信JS-SDK配置失败:', res);
    });

    wx.ready(function () {
    // 在这里调用 API

if(document.getElementById('znaudio_btn')){
znyinyuechushis();//加载音乐播放控件
}

        // 自定义"分享给朋友"及"分享到QQ"按钮的分享内容（新接口，推荐使用）
        wx.updateAppMessageShareData({
            title: '就爱你·校友情', // 分享标题
            desc: '福建师范大学广东校友会一届二次会员大会暨一周年庆活动', // 分享描述
            link: 'https://fnu.mtserver.fun', // 分享链接，该链接域名或路径必须与当前页面对应的服务号JS安全域名一致
            imgUrl: './images/logo.png', // 分享图标
            success: function () {
                // 设置成功
                console.log('分享给朋友配置成功');
            }
        });

        // 自定义"分享到朋友圈"及"分享到QQ空间"按钮的分享内容（新接口，推荐使用）
        wx.updateTimelineShareData({
            title: '就爱你·校友情', // 分享标题

            imgUrl: './images/logo.png', // 分享图标
            success: function () {
                // 设置成功
                console.log('分享到朋友圈配置成功');
            }
        });

		
    });
</script>
