    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // 自定义页面状态处理函数
        function handlePageStatus(data) {
            if (data.status === 'maintenance') {
                // 页面处于维护状态，显示建设中提示
                document.getElementById('maintenanceNotice').style.display = 'block';
                document.getElementById('pageContent').style.display = 'none';
            } else if (data.status === 'active') {
                // 页面正常，显示实际内容
                document.getElementById('maintenanceNotice').style.display = 'none';
                document.getElementById('pageContent').style.display = 'block';
            } else {
                // 未知状态，默认显示实际内容
                console.warn('未知的页面状态:', data.status);
                document.getElementById('maintenanceNotice').style.display = 'none';
                document.getElementById('pageContent').style.display = 'block';
            }
        }

        // 自定义显示页面内容函数
        function showPageContent() {
            // 显示实际内容，隐藏建设中提示
            document.getElementById('maintenanceNotice').style.display = 'none';
            document.getElementById('pageContent').style.display = 'block';
            
            // 显示页面内容
            document.body.style.visibility = 'visible';
        }

        // 初始化页面状态检查
        initPageStatusCheck('transport');

        // 复制地址功能
        function copyAddress() {
            const address = "笑傲江湖庄园营地 广东省广州市黄埔区碧桂园凤凰城凤曦苑西区西北";
            
            if (navigator.clipboard && window.isSecureContext) {
                // 使用现代 Clipboard API
                navigator.clipboard.writeText(address).then(() => {
                    showToast('地址已复制到剪贴板！', 'success');
                }).catch(err => {
                    console.error('复制失败:', err);
                    fallbackCopyTextToClipboard(address);
                });
            } else {
                // 降级方案
                fallbackCopyTextToClipboard(address);
            }
        }

        // 降级复制方案
        function fallbackCopyTextToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.position = "fixed";
            
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showToast('地址已复制到剪贴板！', 'success');
                } else {
                    showToast('复制失败，请手动复制地址', 'error');
                }
            } catch (err) {
                console.error('降级复制失败:', err);
                showToast('复制失败，请手动复制地址', 'error');
            }
            
            document.body.removeChild(textArea);
        }

        // 打开导航应用
        function openNavigation(type) {
            const destination = "笑傲江湖庄园营地";
            const address = "广东省广州市黄埔区碧桂园凤凰城凤曦苑西区西北";
            const encodedDestination = encodeURIComponent(destination);
            const encodedAddress = encodeURIComponent(address);
            
            let url = '';
            
            switch(type) {
                case 'baidu':
                    url = `https://map.baidu.com/?qt=nav&c=289&sc=289&ec=289&sn=2$$$$$$&en=0$$${encodedDestination}$$0$$$$&rn=${encodedAddress}`;
                    break;
                case 'gaode':
                    url = `https://uri.amap.com/navigation?to=${encodedAddress}&toname=${encodedDestination}&callnative=1`;
                    break;
                case 'tencent':
                    url = `https://apis.map.qq.com/uri/v1/routeplan?type=drive&to=${encodedDestination}&tocoord=&policy=0&referer=myapp`;
                    break;
                case 'apple':
                    url = `http://maps.apple.com/?daddr=${encodedAddress}&dirflg=d`;
                    break;
                default:
                    showToast('不支持的导航类型', 'error');
                    return;
            }
            
            // 尝试打开导航应用
            window.open(url, '_blank');
            showToast('正在打开导航应用...', 'info');
        }

        // 显示提示消息
        function showToast(message, type = 'info') {
            // 创建提示元素
            const toast = document.createElement('div');
            toast.className = `alert alert-${type === 'success' ? 'success' : type === 'error' ? 'danger' : 'info'} position-fixed`;
            toast.style.cssText = `
                top: 20px;
                right: 20px;
                z-index: 9999;
                min-width: 300px;
                opacity: 0;
                transition: opacity 0.3s ease;
            `;
            toast.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'} me-2"></i>
                ${message}
            `;
            
            document.body.appendChild(toast);
            
            // 显示动画
            setTimeout(() => {
                toast.style.opacity = '1';
            }, 100);
            
            // 自动隐藏
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => {
                    if (document.body.contains(toast)) {
                        document.body.removeChild(toast);
                    }
                }, 300);
            }, 3000);
        }
    </script>
