    <!-- 照片直播页面脚本 -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const iframe = document.getElementById('photoLiveFrame');
            const loadingIndicator = document.getElementById('loadingIndicator');
            
            // iframe加载完成后隐藏加载指示器
            iframe.addEventListener('load', function() {
                setTimeout(() => {
                    loadingIndicator.style.display = 'none';
                }, 1000);
            });
            
            // iframe加载错误处理
            iframe.addEventListener('error', function() {
                loadingIndicator.innerHTML = `
                    <div class="text-center">
                        <i class="fas fa-exclamation-triangle text-warning fa-3x mb-3"></i>
                        <h5>加载失败</h5>
                        <p class="text-muted">无法加载照片直播内容，请稍后重试或点击下方链接直接访问。</p>
                        <a href="https://m.alltuu.com/album/2276504408/" target="_blank" class="btn btn-primary">
                            <i class="fas fa-external-link-alt me-2"></i>直接访问照片直播
                        </a>
                    </div>
                `;
            });
            
            // 设置超时处理
            setTimeout(() => {
                if (loadingIndicator.style.display !== 'none') {
                    loadingIndicator.innerHTML = `
                        <div class="text-center">
                            <i class="fas fa-clock text-info fa-3x mb-3"></i>
                            <h5>加载时间较长</h5>
                            <p class="text-muted">照片直播内容正在加载中，请耐心等待...</p>
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">加载中...</span>
                            </div>
                        </div>
                    `;
                }
            }, 10000); // 10秒后显示加载时间较长的提示
        });
    </script>
