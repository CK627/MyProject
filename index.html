<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="images/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta name="description" content="衢江文化旅游信息平台 - 探索浙西秘境衢江的山水风光、人文古迹、地道美食与民俗风情">
  <meta name="keywords" content="衢江,文化旅游,浙江旅游,衢州,景点,美食,民俗">
  <title>衢江文化旅游信息平台 - 山水衢江 诗画田园</title>
  <link rel="canonical" href="index.html">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <div id="app">
    <!-- 导航 -->
    <site-header current="index"></site-header>

    <!-- 英雄轮播 -->
    <section class="hero">
      <div class="hero-slides">
        <div class="hero-slide" v-for="(slide, i) in slides" :key="i"
             :class="{ active: currentSlide === i }">
          <img :src="slide.img" :alt="slide.title" class="hero-bg"
               onerror="this.style.display='none'">
          <div class="hero-overlay"></div>
          <div class="hero-content">
            <h1>{{ slide.title }}</h1>
            <p>{{ slide.subtitle }}</p>
            <a href="scenic.html" class="btn btn-hero">开始探索</a>
          </div>
        </div>
      </div>
      <div class="hero-dots">
        <button v-for="(s, i) in slides" :key="i"
                class="hero-dot" :class="{ active: currentSlide === i }"
                @click="goSlide(i)"></button>
      </div>
      <button class="hero-arrow hero-prev" @click="prevSlide">‹</button>
      <button class="hero-arrow hero-next" @click="nextSlide">›</button>
    </section>

    <!-- 特色亮点 -->
    <section class="page-section features-section">
      <div class="container">
        <div class="features-grid">
          <div class="feature-item" v-for="f in features" :key="f.title">
            <div class="feature-icon">{{ f.icon }}</div>
            <h3>{{ f.title }}</h3>
            <p>{{ f.desc }}</p>
          </div>
        </div>
      </div>
    </section>

    <!-- 精选景点 -->
    <section class="page-section">
      <div class="container">
        <div class="section-header">
          <h2>精选景点</h2>
          <p class="subtitle">山水之间，寻觅衢江独有的自然之美与人文韵味</p>
          <div class="divider"></div>
        </div>
        <div class="grid-4">
          <spot-card v-for="item in featuredScenic" :key="item.id" :item="item" type="scenic"></spot-card>
        </div>
        <div class="section-more">
          <a href="scenic.html" class="btn btn-outline">查看全部景点 →</a>
        </div>
      </div>
    </section>

    <!-- 美食推荐 -->
    <section class="page-section">
      <div class="container">
        <div class="section-header">
          <h2>美食推荐</h2>
          <p class="subtitle">品味舌尖上的衢江，感受地道浙西风味</p>
          <div class="divider"></div>
        </div>
        <div class="grid-4">
          <spot-card v-for="item in featuredFood" :key="item.id" :item="item" type="food"></spot-card>
        </div>
        <div class="section-more">
          <a href="food.html" class="btn btn-outline">查看全部美食 →</a>
        </div>
      </div>
    </section>

    <!-- 民俗文化预览 -->
    <section class="page-section culture-preview">
      <div class="container">
        <div class="section-header">
          <h2>民俗文化</h2>
          <p class="subtitle">传承千年的民间智慧，感受衢江深厚文化积淀</p>
          <div class="divider"></div>
        </div>
        <div class="grid-3">
          <spot-card v-for="item in featuredCulture" :key="item.id" :item="item" type="culture"></spot-card>
        </div>
        <div class="section-more">
          <a href="culture.html" class="btn btn-outline">了解更多民俗 →</a>
        </div>
      </div>
    </section>

    <!-- 页脚 -->
    <site-footer></site-footer>

    <!-- 回到顶部 -->
    <button class="back-to-top">↑</button>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
