<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="images/favicon.ico" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="宁波住宿推荐：星级酒店、特色民宿，为您的宁波之旅提供舒适的休憩之所。">
  <title>住宿推荐 — 宁波旅游</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css?v=20260220b">
  <link rel="stylesheet" href="css/accommodation.css">
</head>
<body>

  <section class="hero hero--small">
    <div class="hero__bg">
      <img src="images/accommodation/hotel.png" alt="宁波住宿">
    </div>
    <div class="hero__overlay hero__overlay--accommodation"></div>
    <div class="hero__content">
      <h1 class="hero__title">精选住宿</h1>
      <p class="hero__subtitle">从豪华酒店到山间民宿，总有一处温馨的归所</p>
    </div>
  </section>

  <!-- 星级酒店 -->
  <section class="section" id="hotel">
    <div class="container">
      <div class="section-header" data-animate="fade-in-up">
        <h2 class="section-title">星级酒店</h2>
        <p class="section-subtitle">商务出行与高端度假的理想选择</p>
      </div>
      <div class="grid grid--3" data-acc-category="星级酒店" data-animate="fade-in-up" data-delay="0.1">
        <div class="loading-hint">加载中...</div>
      </div>
    </div>
  </section>

  <!-- 特色民宿 -->
  <section class="section section--alt" id="homestay">
    <div class="container">
      <div class="section-header" data-animate="fade-in-up">
        <h2 class="section-title">特色民宿</h2>
        <p class="section-subtitle">融入当地生活，感受宁波的另一面</p>
      </div>
      <div class="grid grid--3" data-acc-category="特色民宿" data-animate="fade-in-up" data-delay="0.1">
        <div class="loading-hint">加载中...</div>
      </div>
    </div>
  </section>

  <!-- 经济连锁 -->
  <section class="section" id="chain">
    <div class="container">
      <div class="section-header" data-animate="fade-in-up">
        <h2 class="section-title">经济连锁</h2>
        <p class="section-subtitle">实惠之选，舒适便捷</p>
      </div>
      <div class="grid grid--3" data-acc-category="经济连锁" data-animate="fade-in-up" data-delay="0.1">
        <div class="loading-hint">加载中...</div>
      </div>
    </div>
  </section>

  <!-- 青年旅舍 -->
  <section class="section section--alt" id="hostel">
    <div class="container">
      <div class="section-header" data-animate="fade-in-up">
        <h2 class="section-title">青年旅舍</h2>
        <p class="section-subtitle">背包客的社交天堂</p>
      </div>
      <div class="grid grid--3" data-acc-category="青年旅舍" data-animate="fade-in-up" data-delay="0.1">
        <div class="loading-hint">加载中...</div>
      </div>
    </div>
  </section>

  <!-- 住宿小贴士 -->
  <section class="section">
    <div class="container">
      <div class="section-header" data-animate="fade-in-up">
        <h2 class="section-title">住宿小贴士</h2>
      </div>
      <div class="grid grid--2" data-animate="fade-in-up" data-delay="0.1">
        <div class="tip-card">
          <h4 class="tip-card__title">📅 旺季提醒</h4>
          <p class="tip-card__desc">每年5月-10月为旅游旺季，特别是国庆、暑期价格上浮明显，建议提前2-4周预订。象山开渔节期间（9月中旬）民宿尤其紧张。</p>
        </div>
        <div class="tip-card">
          <h4 class="tip-card__title">📍 区域选择</h4>
          <p class="tip-card__desc">市中心（海曙/鄞州）交通便利，适合城市游览；东钱湖/四明山适合休闲度假；象山/奉化适合自然风光爱好者。</p>
        </div>
      </div>
    </div>
  </section>

  <script src="js/common.js?v=20260220b"></script>
  <script src="js/accommodation.js"></script>
</body>
</html>
