name: ci

# 本仓库是多项目 monorepo（每个项目一个分支），CI 只关心 ptool 分支
on:
  push:
    branches: [ptool]
  pull_request:
    branches: [ptool]

jobs:
  # 语法门 + shell 侧冒烟；macOS / Linux 双跑，覆盖 BSD/GNU 差异
  shell:
    name: shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: bash -n / zsh -n + 冒烟
        run: bash tests/smoke.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck（error 阻塞 / warning 仅提示）
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          mapfile -t files < <(find . -type f \
            \( -name '*.sh' -o -name '*.bash' -o -name 'postinstall.in' -o -name 'uninstall.in' \) \
            -not -path './dist/*')
          echo "-- severity=error（阻塞）"
          shellcheck --shell=bash --severity=error "${files[@]}"
          echo "-- severity=warning（仅提示；存量告警收敛后可改为阻塞）"
          shellcheck --shell=bash --severity=warning "${files[@]}" || true

  # 文件契约：行尾 + 编码。两条都只能靠机器守，人工 review 看不出来。
  contract:
    name: file contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # CRLF：GitHub 服务端生成的归档不执行 .gitattributes 的 eol=crlf，
      # 所以 Windows 的 ptool update 在复制后自行归一化（见 bin/ptool.bat 的 :to_crlf）。
      - name: .bat / .ps1 必须是 CRLF
        run: |
          set -uo pipefail
          fail=0
          check() {
            if perl -0777 -ne 'exit(1) if /(?<!\r)\n/' "$1"; then
              echo "  ok   - $2"
            else
              echo "  FAIL - $2（含裸 LF，应为 CRLF）"
              fail=1
            fi
          }
          echo "== 工作树 =="
          while IFS= read -r f; do check "$f" "$f"; done < <(git ls-files '*.bat' '*.ps1')
          echo "== git archive 导出 =="
          tmp=$(mktemp -d)
          git archive HEAD | tar -x -C "$tmp" || exit 1
          while IFS= read -r f; do check "$f" "archive:${f#"$tmp"/}"; done \
            < <(find "$tmp" -type f \( -name '*.bat' -o -name '*.ps1' \))
          exit "$fail"

      # .bat 编码契约（2026-10 修订，原为「纯 ASCII」）：
      #   · **不许有 BOM**：cmd 会把 BOM 当成命令的一部分，第一行直接报错
      #     （实测 `'?@echo' 不是内部或外部命令`），之后整段退化成逐行交互执行；
      #   · **必须 CRLF**（由上一步检查）；
      #   · 含中文时，`chcp 65001` 必须出现在第一处非 ASCII **之前**。
      #
      # 2026-10 在 Windows 10 19045 / 代码页 936 的 cmd 上实测：UTF-8 无 BOM +
      # CRLF + chcp 65001 的 .bat，中文 REM / echo / if 块在**直接调用与 `call`
      # 两种方式下都正确显示**。此前「必须纯 ASCII」是基于一次（很可能带 BOM 或
      # 用了 LF 的）失败推断出来的，结论过宽了——现在 .bat 也可以面向中文用户。
      #
      # .ps1 不受此限：PowerShell 自己管编码，且它从不被 cmd `call`。
      - name: .bat 编码契约（无 BOM · 有中文则须 chcp 65001）
        run: |
          set -uo pipefail
          python3 tests/check_bat_encoding.py $(git ls-files '*.bat')
  # Windows 侧冒烟：cmd 的行为只能在 Windows 上验
  windows:
    name: windows smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: windows 冒烟
        shell: pwsh
        run: ./tests/smoke.ps1
