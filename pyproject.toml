[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ctfsweep"
description = "CTF 流量 / 日志 / 注册表 快速扫描器（零依赖，带置信度分级）"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "CK627" }]
keywords = ["ctf", "pcap", "pcapng", "evtx", "forensics", "security", "wireshark"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Topic :: Security",
]
dynamic = ["version"]
dependencies = []

[project.scripts]
ctfsweep = "ctfsweep.cli:main"

[tool.setuptools]
packages = ["ctfsweep", "ctfsweep.core"]

[tool.setuptools.dynamic]
version = { attr = "ctfsweep.__version__" }
